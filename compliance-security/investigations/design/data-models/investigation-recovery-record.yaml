name: Investigation Recovery Record
schema_name: appbase_InvestigationRecoveryRecord
description:

fields:
  - Asset Description: Memo; appbase_assetdescription
  - Current Value: Currency; appbase_currentvalue
  - Disposition: Memo; appbase_disposition
  - Investigation: Lookup (Investigation); appbase_investigation
  - Investigation Finding: Lookup (Investigation Finding); appbase_investigationfinding
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Payment Reference: Text; appbase_paymentreference
  - Recorded By: Lookup (SystemUser); appbase_recordedby
  - Recovered From Account: Lookup (Account); appbase_recoveredfromaccount
  - Recovered From Person: Lookup (Contact); appbase_recoveredfromperson
  - Recovery Amount: Currency; appbase_recoveryamount
  - Recovery Date: Date Time; appbase_recoverydate
  - Recovery Method: Choice; appbase_recoverymethod
  - Recovery Status: Choice; appbase_recoverystatus
  - Recovery Type: Choice; appbase_recoverytype
  - Supporting Document: Lookup (appbase_Document); appbase_supportingdocument
