name: Investigation Party
schema_name: appbase_InvestigationParty
description:

fields:
  - Account: Lookup (Account); appbase_account
  - Confidentiality Level: Choice; appbase_confidentialitylevel
  - Contact Information: Text; appbase_contactinformation
  - Cooperation Status: Choice; appbase_cooperationstatus
  - First Contact Date: Date Time; appbase_firstcontactdate
  - Investigation: Lookup (Investigation); appbase_investigation
  - Investigative Party Role: Lookup (Investigative Party Role); appbase_investigativepartyrole
  - Is Protected: Choice; appbase_isprotected
  - Last Contact Date: Date Time; appbase_lastcontactdate
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Organization Unit: Lookup (appbase_OrganizationUnit); appbase_organizationunit
  - Party Type: Choice; appbase_partytype
  - Person: Lookup (Contact); appbase_person
