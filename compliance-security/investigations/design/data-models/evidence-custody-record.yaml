name: Evidence Custody Record
schema_name: appbase_EvidenceCustodyRecord
description:

fields:
  - Condition After: Memo; appbase_conditionafter
  - Condition Before: Memo; appbase_conditionbefore
  - Custody Event Type: Choice; appbase_custodyeventtype
  - Event Date Time: Date Time; appbase_eventdatetime
  - Evidence Item: Lookup (Evidence Item); appbase_evidenceitem
  - From Custodian: Lookup (Contact); appbase_fromcustodian
  - From Location: Lookup (Evidence Storage Location); appbase_fromlocation
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Purpose: Memo; appbase_purpose
  - Recorded By: Lookup (SystemUser); appbase_recordedby
  - Seal Intact: Choice; appbase_sealintact
  - Seal Number: Text; appbase_sealnumber
  - To Custodian: Lookup (Contact); appbase_tocustodian
  - To Location: Lookup (Evidence Storage Location); appbase_tolocation
  - Witness: Lookup (Contact); appbase_witness
