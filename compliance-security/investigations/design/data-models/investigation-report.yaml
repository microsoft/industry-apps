name: Investigation Report
schema_name: appbase_InvestigationReport
description:

fields:
  - Approval Date: Date Time; appbase_approvaldate
  - Approval Status: Choice; appbase_approvalstatus
  - Approved By: Lookup (SystemUser); appbase_approvedby
  - Distribution Date: Date Time; appbase_distributiondate
  - Distribution List: Memo; appbase_distributionlist
  - External Release Authorized: Choice; appbase_externalreleaseauthorized
  - Investigation: Lookup (Investigation); appbase_investigation
  - Is Public: Choice; appbase_ispublic
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Prepared By: Lookup (SystemUser); appbase_preparedby
  - Prepared Date: Date Time; appbase_prepareddate
  - Report Document: Lookup (appbase_Document); appbase_reportdocument
  - Report Number: Text; appbase_reportnumber
  - Report Status: Choice; appbase_reportstatus
  - Report Summary: Memo; appbase_reportsummary
  - Report Type: Choice; appbase_reporttype
  - Security Classification: Choice; appbase_securityclassification
  - Version Number: Text; appbase_versionnumber
