name: Evidence Item
schema_name: appbase_EvidenceItem
description:

fields:
  - Chain of Custody Verified: Choice; appbase_chainofcustodyverified
  - Collected By: Lookup (Contact); appbase_collectedby
  - Collection Date: Date Time; appbase_collectiondate
  - Current Custodian: Lookup (Contact); appbase_currentcustodian
  - Description: Memo; appbase_description
  - Digital Hash: Text; appbase_digitalhash
  - Evidence Number: Text; appbase_evidencenumber
  - Evidence Status: Choice; appbase_evidencestatus
  - Evidence Storage Location: Lookup (Evidence Storage Location); appbase_evidencestoragelocation
  - Evidence Type: Lookup (Evidence Type); appbase_evidencetype
  - File Format: Text; appbase_fileformat
  - File Size (MB): Decimal; appbase_filesizemb
  - Investigation: Lookup (Investigation); appbase_investigation
  - Is Copy: Choice; appbase_iscopy
  - Is Original: Choice; appbase_isoriginal
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Physical Description: Text; appbase_physicaldescription
  - Potential Evidentiary Value: Choice; appbase_potentialevidentiaryvalue
  - Relevance: Memo; appbase_relevance
  - Security Classification: Choice; appbase_securityclassification
  - Serial Number: Text; appbase_serialnumber
  - Source Account: Lookup (Account); appbase_sourceaccount
  - Source Location: Lookup (appbase_Location); appbase_sourcelocation
  - Source Person: Lookup (Contact); appbase_sourceperson
  - Supporting Document: Lookup (appbase_Document); appbase_supportingdocument
