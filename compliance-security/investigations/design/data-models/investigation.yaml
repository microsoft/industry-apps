name: Investigation
schema_name: appbase_Investigation
description:

fields:
  - Actual Completion Date: Date Time; appbase_actualcompletiondate
  - Actual Hours: Decimal; appbase_actualhours
  - Assigned Organization Unit: Lookup (appbase_OrganizationUnit); appbase_assignedorganizationunit
  - Background: Memo; appbase_background
  - Case Number: Text; appbase_casenumber
  - Case Status: Choice; appbase_casestatus
  - Closure Date: Date Time; appbase_closuredate
  - Closure Rationale: Memo; appbase_closurerationale
  - Compliance Framework: Lookup (appbase_ComplianceFramework); appbase_complianceframework
  - Estimated Hours: Decimal; appbase_estimatedhours
  - Intake Date: Date Time; appbase_intakedate
  - Investigation Budget: Currency; appbase_investigationbudget
  - Investigation Start Date: Date Time; appbase_investigationstartdate
  - Investigation Team: Text; appbase_investigationteam
  - Investigative Category: Lookup (Investigative Category); appbase_investigativecategory
  - Investigative Type: Lookup (Investigative Type); appbase_investigativetype
  - Is Confidential: Choice; appbase_isconfidential
  - Judicial District: Lookup (appbase_JudicialDistrict); appbase_judicialdistrict
  - Lead Investigator: Lookup (Contact); appbase_leadinvestigator
  - Legal Authority: Lookup (appbase_LegalAuthority); appbase_legalauthority
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Overall Disposition: Choice; appbase_overalldisposition
  - Parent Investigation: Lookup (Investigation); appbase_parentinvestigation
  - Primary Location: Lookup (appbase_Location); appbase_primarylocation
  - Priority: Choice; appbase_priority
  - Related Investigation: Lookup (Investigation); appbase_relatedinvestigation
  - Reporting Organization Unit: Lookup (appbase_OrganizationUnit); appbase_reportingorganizationunit
  - Security Classification: Choice; appbase_securityclassification
  - Severity Level: Choice; appbase_severitylevel
  - Subject Summary: Memo; appbase_subjectsummary
  - Target Completion Date: Date Time; appbase_targetcompletiondate
  - Total Allegations: Integer; appbase_totalallegations
  - Total Findings: Integer; appbase_totalfindings
  - Visibility: Choice; appbase_visibility
