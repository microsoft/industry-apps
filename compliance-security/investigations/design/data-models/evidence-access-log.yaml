name: Evidence Access Log
schema_name: appbase_EvidenceAccessLog
description:

fields:
  - Access Date Time: Date Time; appbase_accessdatetime
  - Accessed By: Lookup (Contact); appbase_accessedby
  - Access Purpose: Memo; appbase_accesspurpose
  - Access Type: Choice; appbase_accesstype
  - Document Downloaded: Choice; appbase_documentdownloaded
  - Download Count: Integer; appbase_downloadcount
  - Evidence Item: Lookup (Evidence Item); appbase_evidenceitem
  - IP Address: Text; appbase_ipaddress
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - System User: Text; appbase_systemuser
