  - From Organization Unit: Lookup (appbase_OrganizationUnit); appbase_fromorganizationunit
  - From Person: Lookup (Contact); appbase_fromperson
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Recorded By: Lookup (Contact); appbase_recordedby
  - To Location: Lookup (appbase_Location); appbase_tolocation
  - To Organization Unit: Lookup (appbase_OrganizationUnit); appbase_toorganizationunit
  - To Person: Lookup (Contact); appbase_toperson
  - Verification Method: Text; appbase_verificationmethod
