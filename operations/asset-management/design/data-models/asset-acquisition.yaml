name: Asset Acquisition
schema_name: appbase_AssetAcquisition
description:

fields:
  - Acquisition Date: Date Time; appbase_acquisitiondate
  - Acquisition Type: Choice; appbase_acquisitiontype
  - Funding Source: Text; appbase_fundingsource
  - Invoice Date: Date Time; appbase_invoicedate
  - Invoice Number: Text; appbase_invoicenumber
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Payment Status: Choice; appbase_paymentstatus
  - Purchase Order Number: Text; appbase_purchaseordernumber
  - Received By: Lookup (Contact); appbase_receivedby
  - Received Date: Date Time; appbase_receiveddate
  - Supplier: Lookup (Account); appbase_supplier
  - Total Cost: Currency; appbase_totalcost
  - Warranty Expiration Date: Date Time; appbase_warrantyexpirationdate
