name: Asset Audit
schema_name: appbase_AssetAudit
description:

fields:
  - Action Status: Choice; appbase_actionstatus
  - Audit End Date: Date Time; appbase_auditenddate
  - Auditor: Lookup (Contact); appbase_auditor
  - Audit Start Date: Date Time; appbase_auditstartdate
  - Audit Type: Choice; appbase_audittype
  - Description: Memo; appbase_description
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Scope Location: Lookup (appbase_Location); appbase_scopelocation
  - Scope Organization Unit: Lookup (appbase_OrganizationUnit); appbase_scopeorganizationunit
  - Total Assets Expected: Integer; appbase_totalassetsexpected
  - Total Assets Verified: Integer; appbase_totalassetsverified
  - Total Discrepancies: Integer; appbase_totaldiscrepancies
