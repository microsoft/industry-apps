name: Asset Owner
schema_name: appbase_AssetOwner
description:

fields:
  - Asset: Lookup (Asset); appbase_asset
  - Effective End Date: Date Time; appbase_effectiveenddate
  - Effective Start Date: Date Time; appbase_effectivestartdate
  - Is Current: Choice; appbase_iscurrent
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Owned From Date Time: Date Time; appbase_ownedfromdatetime
  - Owned To Date Time: Date Time; appbase_ownedtodatetime
  - Owner Account: Lookup (Account); appbase_owneraccount
  - Owner Organization Unit: Lookup (appbase_OrganizationUnit); appbase_ownerorganizationunit
  - Ownership Type: Choice; appbase_ownershiptype
  - Person: Lookup (Contact); appbase_person
