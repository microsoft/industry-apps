name: Asset Service Record
schema_name: appbase_AssetServiceRecord
description:

fields:
  - Actual Return Date Time: Date Time; appbase_actualreturndatetime
  - Asset: Lookup (Asset); appbase_asset
  - Asset Service Type: Lookup (Asset Service Type); appbase_assetservicetype
  - Description: Memo; appbase_description
  - Expected Return Date Time: Date Time; appbase_expectedreturndatetime
  - Meter Reading: Integer; appbase_meterreading
  - Name: Text; appbase_name
  - Next Service Due Date: Date Time; appbase_nextserviceduedate
  - Notes: Memo; appbase_notes
  - Service Cost: Currency; appbase_servicecost
  - Service Date: Date Time; appbase_servicedate
  - Service End Date Time: Date Time; appbase_serviceenddatetime
  - Service Location: Lookup (appbase_Location); appbase_servicelocation
  - Service Notes: Memo; appbase_servicenotes
  - Service Provider: Lookup (Account); appbase_serviceprovider
  - Service Provider Contact: Lookup (Contact); appbase_serviceprovidercontact
  - Service Request Date Time: Date Time; appbase_servicerequestdatetime
  - Service Request Description: Memo; appbase_servicerequestdescription
  - Service Start Date Time: Date Time; appbase_servicestartdatetime
  - Service Status: Choice; appbase_servicestatus
  - Service Type: Lookup (Asset Service Type); appbase_servicetype
