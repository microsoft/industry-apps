name: Asset Inspection Requirement
schema_name: appbase_AssetInspectionRequirement
description:

fields:
  - Asset Type: Lookup (Asset Type); appbase_assettype
  - Compliance Framework: Lookup (appbase_ComplianceFramework); appbase_complianceframework
  - Description: Memo; appbase_description
  - Inspection Frequency: Choice; appbase_inspectionfrequency
  - Inspection Frequency (Days): Integer; appbase_inspectionfrequencydays
  - Name: Text; appbase_name
  - Regulatory Authority: Lookup (appbase_LegalAuthority); appbase_regulatoryauthority
  - Specific Asset: Lookup (Asset); appbase_specificasset
