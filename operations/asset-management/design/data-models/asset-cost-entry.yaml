name: Asset Cost Entry
schema_name: appbase_AssetCostEntry
description:

fields:
  - Amount: Currency; appbase_amount
  - Asset: Lookup (Asset); appbase_asset
  - Capitalizable: Choice; appbase_capitalizable
  - Cost Date: Date Time; appbase_costdate
  - Cost Type: Choice; appbase_costtype
  - Description: Memo; appbase_description
  - Invoice Number: Text; appbase_invoicenumber
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Vendor: Lookup (Account); appbase_vendor
