  - Environmental Compliance Verified: Choice; appbase_environmentalcomplianceverified
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Recipient Account: Lookup (Account); appbase_recipientaccount
  - Recipient Person: Lookup (Contact); appbase_recipientperson
  - Sale Price: Currency; appbase_saleprice
