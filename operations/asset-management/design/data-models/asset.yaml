name: Asset
schema_name: appbase_Asset
description:

fields:
  - Acquired Date Time: Date Time; appbase_acquireddatetime
  - Asset Acquisition: Lookup (Asset Acquisition); appbase_assetacquisition
  - Asset Category: Lookup (Asset Category); appbase_assetcategory
  - Asset Condition: Choice; appbase_assetcondition
  - Asset Number: Text; appbase_assetnumber
  - Asset Status: Choice; appbase_assetstatus
  - Asset Type: Lookup (Asset Type); appbase_assettype
  - Barcode: Text; appbase_barcode
  - Current Assignment: Lookup (Asset Assignment); appbase_currentassignment
  - Current Location: Lookup (appbase_Location); appbase_currentlocation
  - Current Owner: Lookup (Asset Owner); appbase_currentowner
  - Depreciation Method: Choice; appbase_depreciationmethod
  - Description: Memo; appbase_description
  - Estimated Value: Currency; appbase_estimatedvalue
  - Expected Useful Life (Years): Integer; appbase_expectedusefullifeyears
  - In Service Date: Date Time; appbase_inservicedate
  - Is Disposable: Choice; appbase_isdisposable
  - Last Inventory Date: Date Time; appbase_lastinventorydate
  - Location: Lookup (appbase_Location); appbase_location
  - Location Note: Memo; appbase_locationnote
  - Name: Text; appbase_name
  - Notes: Memo; appbase_notes
  - Organization Unit: Lookup (appbase_OrganizationUnit); appbase_organizationunit
  - Parent Asset: Lookup (Asset); appbase_parentasset
  - Purchased Date: Date Time; appbase_purchaseddate
  - Quantity: Float; appbase_quantity
  - Related Product: Lookup (appbase_Product); appbase_relatedproduct
  - Requires Inspection: Choice; appbase_requiresinspection
  - RF Tag: Text; appbase_rftag
  - Serial Number: Text; appbase_serialnumber
  - Service Tag: Text; appbase_servicetag
  - Unit Cost: Currency; appbase_unitcost
