scenario_name: supervisor-retaliation-appeal
display_name: Performance Rating Dispute with Retaliation Appeal
module: workforce/dispute-resolution
process: intake-to-formal-dispute, conduct-investigation, issue-determination, handle-appeal
version: "1.0"

# Scenario description (2-3 paragraphs with all context)
description: >
  This scenario involves a complex dispute where employee Robert Williams, a quality assurance
  analyst with 7 years at the company, believes his supervisor Lisa Rodriguez gave him an unfairly
  low performance rating in retaliation for his participation as a witness in a previous
  investigation. Robert had provided testimony six months earlier in a different workplace dispute
  where he corroborated another employee's complaint about the department's work practices. Two
  months after that investigation concluded, Robert received a performance rating of "Needs
  Improvement" for the first time in his career, despite believing his work quality had not
  changed. His rating included criticism of his "attitude" and "team collaboration" that he feels
  are subjective and unsupported.
  
  The intake is handled by Kevin Park, a newer intake coordinator with 2 years of experience who
  is still learning to recognize patterns of potential retaliation. Kevin receives Robert's
  complaint on March 18, 2026 at 10:30 AM. Robert is clearly frustrated and presents a thick
  folder of his previous performance reviews, project completion records, and email exchanges with
  Lisa. Kevin recognizes the retaliation angle and escalates the case to senior investigator
  Angela Morrison. Angela is a highly experienced investigator with 15 years handling complex
  employment matters, including previous retaliation cases. She creates a formal dispute on March
  20, 2026 and classifies it as high severity due to the retaliation allegations, which have legal
  implications under whistleblower protection policies.
  
  Angela conducts a thorough investigation over four weeks, interviewing Robert, Lisa, three
  peers, and the HR business partner. She reviews performance documentation going back three years
  and examines the timeline of the previous investigation. On April 22, 2026, deciding official
  Patricia Chen issues a determination partially substantiating the retaliation claim. The
  determination finds that while some performance concerns were legitimate, the rating was
  disproportionately harsh and the timing raises concerns. The remedy includes changing Robert's
  rating to "Meets Expectations," providing Lisa with additional training on retaliation
  prevention, and implementing a monitoring plan. However, Lisa believes the determination is
  unfair to her and that her performance assessment was legitimate. On May 1, 2026, Lisa files an
  appeal through her union representative, arguing that the investigation failed to adequately
  consider her documented performance concerns and coaching conversations with Robert. The appeal
  is assigned to Vice President of Human Resources Michael Santos, who must review the entire case
  and determine whether the original determination was appropriate or should be modified.

# Data generation hints for LLM
generation_hints:
  - Timeline spans several months showing progression from retaliation to investigation to appeal
  - Intake coordinator shows he's learning but recognizes when to escalate
  - Investigator demonstrates deep experience with sensitive retaliation cases
  - Interview summaries show conflicting perspectives that are both partially credible
  - Evidence includes performance documentation, email trails, and timeline analysis
  - Determination shows careful weighing of competing evidence and concerns
  - Corrective actions are measured and balanced, not punitive
  - Appeal demonstrates that respondent also has due process rights
  - Appeal arguments focus on procedural fairness and evidence interpretation
  - Reviewing authority must show higher-level judgment and impartiality
  - All parties are professionals with legitimate perspectives
  - Use realistic names and titles for a corporate environment
  - Show the complexity and difficulty of retaliation determinations
  - Timestamps show proper notice periods and policy-compliant processing times
