scenario_name: interpersonal-conflict-mediation
display_name: Team Conflict Resolved Through Mediation
module: workforce/dispute-resolution
process: intake-to-formal-dispute
version: "1.0"

# Scenario description (2-3 paragraphs with all context)
description: >
  This scenario involves a dispute between two team members, Michelle Anderson and James Park,
  who work together in the marketing department. Michelle and James have been colleagues for 18
  months but their working relationship has deteriorated over the past 6 weeks. The conflict began
  with disagreements over project approach and communication style, but has escalated to the point
  where they avoid speaking to each other directly and communicate only through terse emails that
  copy their manager. Other team members have noticed the tension and it's affecting the team's
  morale and productivity. Neither Michelle nor James has engaged in policy violations, but the
  situation is creating a hostile work environment for the entire team.
  
  Their manager, Christine Lopez, encouraged them to work it out themselves initially, but after
  three weeks with no improvement, she referred them to the dispute resolution process on April
  18, 2026. The intake is handled by Tom Richards, an intake coordinator who has particular
  expertise in peer conflict situations. Tom meets with Michelle on April 19 at 9:00 AM and James
  separately at 2:00 PM the same day. Both express frustration with the other's work style and
  communication. Tom recognizes this as a situation that might benefit from mediation rather than
  formal investigation. After consulting with his supervisor, Tom creates an intake record and
  contacts the organization's internal mediator, Diana Martinez, who has 10 years of experience
  facilitating workplace conflict resolution.
  
  Diana meets with both parties individually on April 22, 2026 to assess their willingness to
  participate in mediation. Both Michelle and James express a desire to resolve the situation,
  though each believes the other is primarily at fault. Diana schedules a mediation session for
  April 25, 2026. During the three-hour mediation session, Diana facilitates a structured
  conversation where Michelle and James are able to express their concerns, identify
  misunderstandings, and find common ground. They agree on specific communication protocols,
  project collaboration approaches, and quarterly check-ins to prevent future conflicts. The
  mediation successfully resolves the dispute without needing to convert to a formal investigation.
  Tom closes the intake on April 26, 2026 with a disposition of "Resolved through Alternative
  Dispute Resolution" and both Michelle and James report improved working relationship in
  follow-up conversations with Christine.

# Data generation hints for LLM
generation_hints:
  - This is a positive outcome showing alternative dispute resolution
  - Intake coordinator demonstrates good judgment in recognizing mediation opportunity
  - No formal dispute record is created - resolved at intake stage
  - Both parties are reasonable people with a genuine conflict, not misconduct
  - Mediator shows skilled facilitation and neutrality
  - Timeline is compressed compared to formal investigation (resolved in one week)
  - Disposition field shows "Resolved through Alternative Dispute Resolution"
  - No need for parties, evidence, or investigation records
  - Follow-up shows successful resolution and improved working relationship
  - Demonstrates that not all intakes become formal disputes
  - Use realistic workplace conflict dynamics that many can relate to
  - Show that early intervention and appropriate process selection can resolve issues efficiently
