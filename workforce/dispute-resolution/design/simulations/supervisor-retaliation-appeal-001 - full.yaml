        coaching, reliance on subjective criteria, deviation from performance management
        best practices. While Lisa Rodriguez may have had some legitimate concerns
        about Williams' receptiveness to supervisory direction, the manner in which
        rating was issued - without prior coaching, objective metrics, or documentation -
        undermines legitimacy of rating and creates inference of retaliatory motive.
        Rating should be adjusted to Meets Expectations to remedy disproportionate
        adverse action. Corrective actions focus on training and monitoring rather
        than discipline, given lack of definitive proof of malicious intent.
      appbase_remedy: >
        (1) Adjust Robert Williams' 2025 annual performance rating from Needs
        Improvement to Meets Expectations; (2) Provide Lisa Rodriguez with training
