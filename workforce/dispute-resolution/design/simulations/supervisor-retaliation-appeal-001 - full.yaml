        legitimate performance concerns may exist, but rating was disproportionately
        harsh given lack of progressive discipline and prior consistent high performance.
      appbase_rationale: >
        Investigation findings support partial substantiation: (1) Robert Williams
        engaged in protected activity by providing truthful witness testimony on
        9/28/25; (2) Needs Improvement rating issued 2/15/26 constitutes adverse
        employment action affecting compensation and career progression; (3) Temporal
