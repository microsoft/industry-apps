  # Event 44: Issue appellate decision
  - event_id: 44
    timestamp: 2026-05-20T10:00:00Z
    operation: update
    entity: appbase_disputeappeal
    record_reference: "{{appeal_record.id}}"
    performed_by: Michael Santos (reviewing_authority)
    
    reasoning: >
      After careful review, Michael Santos issues his appellate decision. This is
      a difficult case with reasonable arguments on both sides. Michael concludes
      that Patricia's determination was within the range of reasonable decisions
      given the evidence. However, he modifies slightly: he removes the monitoring
      requirement for Lisa, finding that the training requirement alone is sufficient
      corrective action. He upholds the rating adjustment and training requirement,
      finding that the procedural failures (lack of documentation) justify those
      remedies even if retaliatory intent wasn't definitively proven. He characterizes
      this as a "modified affirmation" - mostly upholding but easing one requirement.
    
    fields:
      appbase_stage: 147130004  # Decision Pending
      appbase_decisionstatus: 147130003  # Modified
      appbase_overallresult: 147130003  # Modified (assuming such a value exists)
      appbase_decisiondate: 2026-05-20T10:00:00Z
      appbase_decisionsummary: >
        Appeal PARTIALLY GRANTED with MODIFICATION. Original determination is
        substantially affirmed but modified to remove monitoring requirement.
      appbase_rationale: >
        After thorough review of complete record and appellate hearing, this reviewing
        authority finds that deciding official Patricia Chen's determination was
        within the range of reasonable decisions based on the evidence presented.
        The investigation was thorough and fair. While Rodriguez raises valid points
        about her good faith concerns, the procedural failures in performance
        management documentation are undisputed and significant. The temporal
        relationship between Williams' testimony and poor rating, combined with
        lack of contemporaneous coaching documentation, provides reasonable basis
        for concern about retaliation influence even if malicious intent cannot be
        proven. Rodriguez's handwritten notes, while genuine, were not shared with
        Williams and thus did not provide him fair opportunity to address concerns.
        HOWEVER, the 6-month monitoring requirement is excessive given Rodriguez's
        overall strong management record and lack of prior concerns. The training
        requirement is sufficient corrective action to address the documentation
        deficiencies. MODIFICATION: Remove monitoring requirement (CA-DSP-2026-0089-03).
        AFFIRMATION: Uphold rating adjustment and training requirement. This balanced
        approach recognizes both Rodriguez's legitimate supervisory prerogatives and
        the need to protect employees who provide witness testimony.
      appbase_remedy: >
        Modified determination: (1) Affirm adjustment of Williams' rating to Meets
        Expectations; (2) Affirm training requirement for Rodriguez; (3) Remove
        6-month monitoring plan; (4) Note in Rodriguez's file should reflect modified
        outcome, not full finding against her.
      appbase_instructionstoparties: >
        (1) HR to implement rating adjustment immediately; (2) Rodriguez to complete
        required training by 6/15/26; (3) Monitoring plan cancelled; (4) This decision
        is final, no further appeal available per policy.

