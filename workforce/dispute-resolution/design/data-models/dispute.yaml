name: Dispute
schema_name: appbase_Dispute
plural_name: appbase_disputes
description:

fields:
  - "Case Number: Text; appbase_casenumber"
  - "Close Date: Date Time; appbase_closedate"
  - "Compliance Framework: Lookup (appbase_ComplianceFramework); appbase_complianceframework"
  - "Decision Status: Choice; appbase_decisionstatus; optionset=appbase_itemdecisionstatus"
  - "Description: Memo; appbase_description"
  - "Dispute Type: Choice; appbase_disputetype"
  - "Filed Date: Date Time; appbase_fileddate"
  - "Is Anonymous: Choice; appbase_isanonymous; optionset=appbase_yesno"
  - "Is Confidential: Choice; appbase_isconfidential; optionset=appbase_yesno"
  - "Legal Authority: Lookup (appbase_LegalAuthority); appbase_legalauthority"
  - "Case Title: Text; appbase_name"
  - "Organization Unit: Lookup (appbase_OrganizationUnit); appbase_organizationunit"
  - "Overall Result: Choice; appbase_overallresult"
  - "Priority: Choice; appbase_priority"
  - "Severity Level: Choice; appbase_severitylevel"
  - "Stage: Choice; appbase_stage; optionset=appbase_disputestage"
