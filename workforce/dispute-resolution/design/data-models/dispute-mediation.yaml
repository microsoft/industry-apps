name: Dispute Mediation
schema_name: appbase_DisputeMediation
plural_name: appbase_disputemediations
description:

fields:
  - "Actual Date Time: Date Time; appbase_actualdatetime"
  - "Agreement: Lookup (appbase_Agreement); appbase_agreement"
  - "Agreement Reached: Choice; appbase_agreementreached; optionset=appbase_yesno"
  - "Decision Status: Choice; appbase_decisionstatus; optionset=appbase_itemdecisionstatus"
  - "Description: Memo; appbase_description"
  - "Dispute: Lookup (Dispute); appbase_dispute"
  - "Document: Lookup (appbase_Document); appbase_document"
  - "Is Voluntary: Choice; appbase_isvoluntary; optionset=appbase_yesno"
  - "Location: Lookup (appbase_Location); appbase_location"
  - "Mediation Number: Text; appbase_mediationnumber"
  - "Mediation Outcome: Choice; appbase_mediationoutcome; optionset=appbase_disputemediationoutcome"
  - "Mediation Title: Text; appbase_name"
  - "Scheduled Date Time: Date Time; appbase_scheduleddatetime"
  - "Stage: Choice; appbase_stage; optionset=appbase_disputemediationstage"
